# brew tap-new uses this file to generate a bottle publish workflow for the new tap
name: brew pr-pull

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number
        required: true
      head_sha:
        description: Expected pull request head commit SHA (optional)

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

# `brew pr-pull` cherry-picks the pull request's commits onto `main`, so it can
# only run while they are not on `main` yet: dispatch this on a pull request that
# is still open and whose checks are green. Publishing one that has already been
# merged fails with "The previous cherry-pick is now empty", whichever merge
# method was used, so this workflow must run before the merge rather than after.
#
# The bottle commit is added to the pull request's own branch, as `homebrew/core`
# does, and lands in `main` when that pull request is squash-merged. `main` is
# protected by the "PR + test-bot" ruleset, which has no bypass actors and cannot
# gain one for GitHub Actions, so a direct push of the bottle commit to `main` is
# not possible.
#
# `Formula/.gitkeep` must stay: when the checkout has neither a `Formula` nor a
# `HomebrewFormula` directory, `Tap#formula_dir` falls back to the tap root, and
# `brew pr-pull` then treats `Casks/*.rb` as formulae and aborts with "No
# available formula with the name .../displaykeep".
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  pr-pull:
    runs-on: ubuntu-latest
    permissions:
      # Read-only. The one write (pushing the bottle commit to the pull request
      # branch) uses the app token below, because pushes made with `GITHUB_TOKEN`
      # do not trigger other workflows and the required `test-bot` checks would
      # never re-run on the bottle commit.
      actions: read
      attestations: write
      contents: read
      id-token: write
      issues: read
      pull-requests: read
    steps:
      # App installation token: expires after 1 hour, is minted per run and is
      # revoked when the job finishes.
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.AUTOBUMP_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOBUMP_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up git
        id: git_setup
        uses: Homebrew/actions/git-user-config@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          # Commit as the app's bot user rather than the human who triggered the
          # run. If the app is renamed, this slug must be updated.
          username: ${{ steps.app-token.outputs.app-slug }}[bot]

      - name: Check pull request
        id: pull_request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PULL_REQUEST: ${{ inputs.pull_request }}
        run: |
          IFS=$'\t' read -r state head_branch head_sha cross < <(
            gh pr view "$PULL_REQUEST" --json state,headRefName,headRefOid,isCrossRepository \
              --jq '[.state, .headRefName, .headRefOid, (.isCrossRepository | tostring)] | @tsv'
          )
          if [[ "$state" != "OPEN" ]]
          then
            echo "::error::Pull request #$PULL_REQUEST is ${state,,}: publish its bottles before merging it"
            exit 1
          fi
          if [[ "$cross" != "false" ]]
          then
            echo "::error::Pull request #$PULL_REQUEST is from a fork, so its branch cannot be pushed to"
            exit 1
          fi
          {
            echo "head_branch=$head_branch"
            echo "head_sha=$head_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Pull bottles
        id: pull_bottles
        env:
          # Downloading the bottle artifacts needs `actions: read`, which the app
          # token does not have. Everything `brew pr-pull` does with this token is
          # a read.
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_GIT_COMMITTER_NAME: ${{ steps.git_setup.outputs.name }}
          HOMEBREW_GIT_COMMITTER_EMAIL: ${{ steps.git_setup.outputs.email }}
          HEAD_SHA: ${{ inputs.head_sha }}
          PULL_REQUEST: ${{ inputs.pull_request }}
        run: |
          if [[ -n "$HEAD_SHA" ]]
          then
            brew pr-pull --debug --retain-bottle-dir --tap="$GITHUB_REPOSITORY" --head-sha="$HEAD_SHA" \
              "$PULL_REQUEST"
          else
            brew pr-pull --debug --retain-bottle-dir --tap="$GITHUB_REPOSITORY" "$PULL_REQUEST"
          fi

      - name: Check for bottles
        id: publish
        env:
          BOTTLE_DIR: ${{ steps.pull_bottles.outputs.bottle_path }}
          PULL_REQUEST: ${{ inputs.pull_request }}
        run: |
          # `brew pr-pull` downloads artifacts, and so runs `brew pr-upload` and
          # commits the bottle blocks, only when the pull request touched a
          # formula. Casks have no bottles, so a cask pull request is a no-op.
          #
          # `--retain-bottle-dir` sets `bottle_path` even when nothing was
          # downloaded, and `actions/attest` fails on a glob that matches nothing.
          if compgen -G "${BOTTLE_DIR:-}/[!.]*.tar.gz" > /dev/null
          then
            ls -l "$BOTTLE_DIR"
            echo "bottles=true" >> "$GITHUB_OUTPUT"
          else
            echo "No bottles to publish for #${PULL_REQUEST}: nothing to commit"
            echo "bottles=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate build provenance
        if: steps.publish.outputs.bottles == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "${{ steps.pull_bottles.outputs.bottle_path }}/*.tar.gz"

      - name: Push bottle commits to the pull request
        if: steps.publish.outputs.bottles == 'true'
        env:
          HEAD_BRANCH: ${{ steps.pull_request.outputs.head_branch }}
          HEAD_SHA: ${{ steps.pull_request.outputs.head_sha }}
          PULL_REQUEST: ${{ inputs.pull_request }}
        run: |
          # `brew pr-pull` commits the bottles on top of `main`, which does not
          # descend from the pull request branch, so this rewrites that branch.
          # The lease makes it fail loudly if somebody pushed to it meanwhile.
          git push origin "HEAD:refs/heads/$HEAD_BRANCH" --force-with-lease="refs/heads/$HEAD_BRANCH:$HEAD_SHA"
          echo "Pushed the bottle commits to $HEAD_BRANCH: merge #$PULL_REQUEST once its checks are green."
