# brew tap-new uses this file to generate an autobump workflow for the new tap
name: brew bump

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/autobump.yml
  schedule:
    # Every day at 4:25 UTC
    - cron: 25 4 * * *
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  autobump:
    # Not ubuntu-latest, unlike the `brew tap-new` template this file came from: `brew bump`
    # audits the cask it is about to bump, and auditing an `app` stanza reads the bundle's
    # Info.plist with plutil, which is macOS-only. On Linux the audit dies with
    # "/usr/bin/env: 'plutil': No such file or directory" (exit 127) *after* downloading the
    # new release, so no PR is opened and the cask silently stays on the old version.
    runs-on: macos-latest
    permissions:
      # The Minted GitHub App token (not GITHUB_TOKEN) does the pushing and PR
      # creation, so GITHUB_TOKEN needs nothing beyond read access.
      contents: read
    steps:
      # App installation token: expires after 1 hour, is minted per run and is
      # revoked when the job finishes. Unlike GITHUB_TOKEN, pushes and pull
      # requests it creates DO trigger workflows (e.g. tests.yml).
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.AUTOBUMP_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOBUMP_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@4790763c0a3ba4036f72634dc079c4a7dfcd4878 # 2026.10.19.1
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up git
        id: git_setup
        uses: Homebrew/actions/git-user-config@4790763c0a3ba4036f72634dc079c4a7dfcd4878 # 2026.10.19.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          # Commit as the app's bot user rather than the human who triggered the
          # run. If the app is renamed, this slug must be updated.
          username: ${{ steps.app-token.outputs.app-slug }}[bot]

      - name: Bump casks
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ steps.app-token.outputs.token }}
          HOMEBREW_GIT_COMMITTER_NAME: ${{ steps.git_setup.outputs.name }}
          HOMEBREW_GIT_COMMITTER_EMAIL: ${{ steps.git_setup.outputs.email }}
          TAP_NAME: ${{ steps.set-up-homebrew.outputs.tap-name }}
        run: brew bump --no-fork --open-pr --casks --tap="$TAP_NAME"

      - name: Bump formulae
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ steps.app-token.outputs.token }}
          HOMEBREW_GIT_COMMITTER_NAME: ${{ steps.git_setup.outputs.name }}
          HOMEBREW_GIT_COMMITTER_EMAIL: ${{ steps.git_setup.outputs.email }}
          TAP_NAME: ${{ steps.set-up-homebrew.outputs.tap-name }}
        run: brew bump --no-fork --open-pr --formulae --bump-synced --tap="$TAP_NAME"
