# Configuration for actionlint, used by `brew style` (via brew test-bot).
# Any `vars.*` referenced in .github/workflows/*.yml must be listed under
# config-variables, or the workflow fails the tap style check.
self-hosted-runner:
  # Labels of self-hosted or not-yet-known-upstream runner in array of strings.
  labels: []
# Configuration variables in array of strings defined in this repository.
# `null` means disabling configuration variables check.
config-variables:
  - AUTOBUMP_APP_CLIENT_ID
